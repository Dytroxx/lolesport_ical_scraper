name: Cleanup old workflow runs

on:
  schedule:
    # Every Sunday at 02:13
    - cron: "13 2 * * 0"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs
        uses: Mattr04/remove-old-workflow-runs@v0
        with:
          token: ${{ github.token }}
          minimum_runs: 5
          days: 30

      - name: Delete workflow runs older than 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepCount = 5;
            const daysThreshold = 7;

            console.log(`Fetching workflow runs...`);

            // Get all workflow runs (paginated)
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              }
            );

            console.log(`Found ${runs.length} workflow runs`);

            // Filter: older than threshold days
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - daysThreshold);

            const runsToDelete = runs.filter(run => {
              const runDate = new Date(run.created_at);
              return runDate < cutoff;
            });

            console.log(`${runsToDelete.length} runs older than ${daysThreshold} days`);

            // Also keep at least keepCount most recent runs
            const sorted = runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toKeep = sorted.slice(0, keepCount);

            const finalToDelete = runsToDelete.filter(run =>
              !toKeep.find(kept => kept.id === run.id)
            );

            console.log(`Will delete ${finalToDelete.length} runs (excluding ${keepCount} most recent)`);

            for (const run of finalToDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                console.log(`Deleted run #${run.id} (${run.run_number})`);
              } catch (error) {
                console.log(`Failed to delete run #${run.id}: ${error.message}`);
              }
            }
