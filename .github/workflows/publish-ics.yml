name: Publish LoL Esports iCal

on:
  workflow_dispatch:
  schedule:
  # Every 6 hours at :13 past the hour
  - cron: "13 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      feed_changed: ${{ steps.feed-diff.outputs.changed }}

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install '.[dev]'

      - name: Test
        run: |
          python -m pytest
          node --test tests/test_frontend.js

      - name: Generate feed
        run: |
          mkdir -p _site
          python -m lolesports_ical --out _site/feed.ics --tz Europe/Berlin --days 30 --history data/history.db --league-index _site/leagues.json
          cp index.html _site/index.html
          # Generate per-league feeds into _site
          python scripts/generate_feeds.py _site/feed.ics _site

      - name: Check if feed changed
        id: feed-diff
        run: |
          python scripts/check_site_changes.py _site >> "$GITHUB_OUTPUT"

      - name: Commit feed and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Do not commit timestamp-only calendar changes.
          if [ "${{ steps.feed-diff.outputs.changed }}" = "true" ]; then
            git add _site/*.ics _site/index.html _site/leagues.json
          fi
          
          # Also commit SQLite history (migrated from JSON)
          if [ -f data/history.db ]; then
            git add data/history.db
          fi
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(feeds): update calendars and match history [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Upload Pages artifact
        if: steps.feed-diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.feed_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Prune old deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environment = 'github-pages';
            const keepCount = 5;

            // Get all deployments for the environment
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment, per_page: 100 }
            );

            console.log(`Found ${deployments.length} deployments`);

            // Sort by created_at descending and skip the ones we want to keep
            const toDelete = deployments
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(keepCount);

            console.log(`Pruning ${toDelete.length} old deployments`);

            for (const deployment of toDelete) {
              try {
                // Mark deployment as inactive first
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: 'inactive'
                });

                // Delete the deployment
                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: deployment.id
                });

                console.log(`Deleted deployment ${deployment.id}`);
              } catch (error) {
                console.log(`Failed to delete deployment ${deployment.id}: ${error.message}`);
              }
            }

  notify-failure:
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **LoL Esports iCal workflow failed**\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
