name: Publish LoL Esports iCal

on:
  workflow_dispatch:
  schedule:
  # Every 6 hours at :13 past the hour
  - cron: "13 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      feed_changed: ${{ steps.feed-diff.outputs.changed }}

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 2  # Need previous commit for feed diff (git show HEAD:feed.ics)

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install .

      - name: Generate feed
        run: |
          mkdir -p _site
          python -m lolesports_ical --out _site/feed.ics --tz Europe/Berlin --days 30 --history data/history.json
          cp index.html _site/index.html
          # Generate per-league feeds
          python scripts/generate_feeds.py _site/feed.ics

      - name: Check if feed changed
        id: feed-diff
        run: |
          # Normalize feeds: strip DTSTAMP (regenerates every run) and compare
          normalize() {
            grep -v '^DTSTAMP:' "$1" 2>/dev/null | sort
          }
          
          changed=false
          # Check combined feed
          if [ -s _site/feed.ics ]; then
            normalize _site/feed.ics > _new_combined.ics || true
            git show HEAD:feed.ics 2>/dev/null | sort > _old_combined.ics || true
            if ! diff -q _old_combined.ics _new_combined.ics > /dev/null 2>&1; then
              changed=true
            fi
          fi
          
          # Check per-league feeds
          for f in _site/feed-*.ics; do
            [ -f "$f" ] || continue
            normalize "$f" > _new_league.ics || true
            slug="${f#_site/feed-}"
            slug="${slug%.ics}"
            git show HEAD:"_site/feed-${slug}.ics" 2>/dev/null | sort > _old_league.ics || true
            if ! diff -q _old_league.ics _new_league.ics > /dev/null 2>&1; then
              changed=true
            fi
          done
          
          if [ "$changed" = "true" ]; then
            echo "Feed changed, will deploy"
          else
            echo "Feed unchanged, skipping deployment"
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Commit feed and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _site/feed.ics _site/feed-*.ics index.html
          # Also commit SQLite history (migrated from JSON)
          if [ -f data/history.db ]; then
            git add data/history.db
          fi
          git pull --rebase origin main || true
          git commit -m "Update feed and match history [skip ci]" --allow-empty
          git push

      - name: Upload Pages artifact
        if: steps.feed-diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.feed_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Prune old deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environment = 'github-pages';
            const keepCount = 5;

            // Get all deployments for the environment
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment, per_page: 100 }
            );

            console.log(`Found ${deployments.length} deployments`);

            // Sort by created_at descending and skip the ones we want to keep
            const toDelete = deployments
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(keepCount);

            console.log(`Pruning ${toDelete.length} old deployments`);

            for (const deployment of toDelete) {
              try {
                // Mark deployment as inactive first
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: 'inactive'
                });

                // Delete the deployment
                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: deployment.id
                });

                console.log(`Deleted deployment ${deployment.id}`);
              } catch (error) {
                console.log(`Failed to delete deployment ${deployment.id}: ${error.message}`);
              }
            }

  notify-failure:
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ **LoL Esports iCal workflow failed**\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
